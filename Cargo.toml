[package]
name = "bintui"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"

[[bin]]
name = "bin"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
fs2 = "0.4"
ignore = "0.4"
ratatui = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
